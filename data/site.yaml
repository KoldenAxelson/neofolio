# ---------------------------------------------------------------------------
# NeoGolio — Site config (port of Neofolio's src/config.ts)
#
# Forkers: edit THIS file first. Everything user-facing reads from here.
# Don't hard-code your name, links, or bio anywhere else.
# ---------------------------------------------------------------------------

# Canonical absolute URL. No trailing slash. (Hugo's baseURL in hugo.toml
# should match; this value is what JSON-LD @ids and feeds are built from.)
url: "https://example.com"

# Site title — used in <title>, OpenGraph, and JSON-LD WebSite name.
title: "NeoGolio"

# Tagline / meta description. Keep under 160 chars.
description: "An AI-readable, opinionated portfolio template for developers in the AI age."

# Owner identity. Used in <Person> JSON-LD and across the site.
author:
  name: "Your Name"
  handle: "@yourhandle"
  role: "Software Engineer"
  location: "City, Country"
  email: "you@example.com"
  # Phone for the CV contact line. Optional — set to "" to hide.
  phone: ""
  # Short bio for the hero section. One or two sentences.
  bio: "I build software that has to keep working when the lights go out. Currently focused on resilient backend systems and developer tooling."
  # Longer bio for /cv and JSON-LD.
  longBio: "A few sentences about who you are, what kinds of problems you take on, and what you care about. Be specific. Generic bios get skipped by humans and indexed flatly by AI."
  # Public résumé downloads (rendered on /cv). Set either to "" to hide.
  resume:
    pdf: "/resume.pdf"
    docx: "/resume.docx"

# Outbound social / professional links. Remove any you don't want shown.
# (Empty strings are skipped by the social-icons partial.)
links:
  github: "https://github.com/your-username"
  linkedin: "https://linkedin.com/in/your-username"
  twitter: ""
  mastodon: ""
  bluesky: ""
  rss: "/rss.xml"

# Top-nav items. Order matters. Each `icon` keys into data/icons.yaml.
# Available icons: folder, newspaper, desktop, globe, user-group,
# briefcase, fire, academic-cap, trophy.
nav:
  - { label: "Projects", href: "/projects", icon: "folder" }
  - { label: "Articles", href: "/articles", icon: "newspaper" }
  - { label: "Certs", href: "/certificates", icon: "trophy" }
  # boost:false → full page load (not an hx-boost swap), so /network's <head>
  # loads its Alpine island runtime. See layouts/_default/network.html.
  - { label: "Network", href: "/network", icon: "user-group", boost: false }
  - { label: "Uses", href: "/uses", icon: "desktop" }
  - { label: "Now", href: "/now", icon: "fire" }
  - { label: "CV", href: "/cv", icon: "briefcase" }

# Locale for <html lang> and date formatting. BCP-47 tag.
locale: "en-US"

# Default OpenGraph image (served from /static, no domain prefix).
# Drop a 1200×630 PNG at static/og-default.png. Set to "" to skip og:image.
ogImage: "/og-default.png"
